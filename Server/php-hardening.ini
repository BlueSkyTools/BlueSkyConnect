; BlueSkyConnect PHP hardening, installed as
; /etc/php/<ver>/apache2/conf.d/99-bluesky-hardening.ini by server-config.sh
; and update-from-git.sh.

; php2shell (CVE-2026-109618 / CVE-2026-109619) stopgap: one of the two bugs is
; reachable through the session upload-progress hook, which runs on any multipart
; POST before application code. BlueSky never uses upload progress. This narrows
; the exposure but is NOT a fix - patch PHP itself.
session.upload_progress.enabled = 0
